name: Verilator Regression

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 verilator

      - name: Show tool versions
        run: |
          make --version
          python3 --version
          verilator --version

      - name: Run regression
        run: make ci
